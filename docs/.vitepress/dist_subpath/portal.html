<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>学习门户 · 射手座导航</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>♐</text></svg>">
</head>
<body>
  <div class="starfield" id="starfield"></div>

  <!-- 导航栏 -->
  <nav class="navbar" id="navbar">
    <div class="logo" onclick="location.href='index.html'">
      <span class="icon">♐</span>
      <span>Sagittarius Nav</span>
    </div>
    <ul class="nav-links">
      <li><a href="portal.html" class="active">学习门户</a></li>
      <li><a href="#" onclick="logout();return false;" style="cursor:pointer">退出</a></li>
    </ul>
    <div class="nav-right" id="navRight"></div>
  </nav>

  <div class="portal-page">
    <!-- Hero -->
    <div class="portal-hero">
      <h1>编程学习导航星图</h1>
      <p>射手座精神 — 永不停歇的探索，从一颗星到另一颗星</p>
      <div class="search-bar">
        <i class="fas fa-search search-icon"></i>
        <input type="text" id="searchInput" placeholder="搜索资源、文档、标签..." oninput="handleSearch()">
      </div>
    </div>

    <!-- 知识星图 -->
    <section class="star-map-section">
      <div class="section-header">
        <h2>知识星图</h2>
        <span class="subtitle">Knowledge Constellation</span>
      </div>
      <p class="section-tip"><i class="fas fa-hand-pointer"></i> 点击星体，跃迁到对应的知识领域</p>
      <div class="star-map-container" id="starMapContainer">
        <svg class="star-map" id="starMapSvg" viewBox="0 0 1100 420" preserveAspectRatio="xMidYMid meet"></svg>
        <div class="star-tooltip" id="starTooltip"></div>
      </div>
    </section>

    <!-- 分类标签 -->
    <div class="category-tabs" id="categoryTabs"></div>

    <!-- 二级分类筛选 -->
    <div class="subcategory-bar" id="subCategoryBar"></div>

    <!-- 文档网格 -->
    <div class="doc-grid" id="docGrid">
      <div class="loading-spinner"><div class="spinner"></div></div>
    </div>
  </div>

  <script src="js/common.js"></script>
  <script>
    initStarfield();

    let allDocs = [];
    let allCategories = [];
    let activeCategory = 'all';
    let activeSubcategory = '';
    let searchKeyword = '';

    const SVG_NS = 'http://www.w3.org/2000/svg';

    async function init() {
      const user = await API.getMe();
      if (!user) { redirect('login.html'); return; }

      document.getElementById('navRight').innerHTML = `
        <span style="color:var(--text-muted);font-size:.85rem;"><i class="fas fa-user-astronaut"></i> ${user.username}</span>
        ${user.role === 'admin' ? `<a href="admin.html" class="btn btn-ghost btn-sm"><i class="fas fa-gear"></i> 管理</a>` : ''}
      `;

      try {
        const [catData, docData] = await Promise.all([
          API.get('/content/categories'),
          API.get('/content/documents')
        ]);
        allCategories = catData.categories;
        allDocs = docData.documents;

        // 从 URL 读取初始筛选状态
        const urlCat = getQueryParam('category');
        const urlSub = getQueryParam('subcategory') || '';
        if (urlCat && allCategories.some(c => c.slug === urlCat)) {
          activeCategory = urlCat;
          activeSubcategory = urlSub;
        }

        renderStarMap();
        renderCategories();
        renderSubcategories();
        renderDocs();

        // 若来自星图跳转，滚动到文档区
        if (urlCat) {
          setTimeout(() => {
            document.getElementById('docGrid').scrollIntoView({ behavior: 'smooth', block: 'start' });
          }, 300);
        }
      } catch (err) {
        showToast(err.message, 'error');
      }
    }

    /* ================= 知识星图 ================= */

    function renderStarMap() {
      const svg = document.getElementById('starMapSvg');
      const tooltip = document.getElementById('starTooltip');
      svg.innerHTML = '';

      // 滤镜定义
      svg.innerHTML = `
        <defs>
          <filter id="starGlow" x="-100%" y="-100%" width="300%" height="300%">
            <feGaussianBlur stdDeviation="3" result="blur"/>
            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
          <filter id="starGlowStrong" x="-150%" y="-150%" width="400%" height="400%">
            <feGaussianBlur stdDeviation="6" result="blur"/>
            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>`;

      const W = 1100, H = 420;
      const cats = allCategories;

      // 主星位置：沿弧线分布
      const mainPositions = cats.map((cat, i) => {
        const t = cats.length === 1 ? 0.5 : i / (cats.length - 1);
        const x = 110 + t * (W - 220);
        // 波浪弧线
        const y = H / 2 + Math.sin(t * Math.PI * 1.6) * 70 + (i % 2 === 0 ? -28 : 28);
        return { x, y };
      });

      const subPositions = [];

      // 计算子星位置：围绕主星呈扇形
      cats.forEach((cat, i) => {
        const main = mainPositions[i];
        const subs = cat.subcategories || [];
        const n = subs.length;
        if (n === 0) { subPositions.push([]); return; }

        const positions = subs.map((sub, j) => {
          // 交替上/下扇形分布
          const spread = Math.min(Math.PI * 0.9, 0.5 + n * 0.35);
          const baseAngle = j % 2 === 0 ? -Math.PI / 2 : Math.PI / 2;
          const offset = Math.floor(j / 2) * (j % 2 === 0 ? 1 : -1) * 0.45;
          const angle = baseAngle + offset * 0.6;
          const radius = 52 + Math.floor(j / 2) * 16 + (n > 4 ? 8 : 0);
          let x = main.x + Math.cos(angle) * radius * 1.35;
          let y = main.y + Math.sin(angle) * radius;
          // 边界保护
          x = Math.max(60, Math.min(W - 60, x));
          y = Math.max(45, Math.min(H - 45, y));
          return { x, y };
        });
        subPositions.push(positions);
      });

      // 星云背景点缀
      const bgGroup = document.createElementNS(SVG_NS, 'g');
      for (let i = 0; i < 60; i++) {
        const dot = document.createElementNS(SVG_NS, 'circle');
        dot.setAttribute('cx', Math.random() * W);
        dot.setAttribute('cy', Math.random() * H);
        dot.setAttribute('r', Math.random() * 1.2 + 0.3);
        dot.setAttribute('fill', 'white');
        dot.setAttribute('opacity', (Math.random() * 0.35 + 0.08).toFixed(2));
        bgGroup.appendChild(dot);
      }
      svg.appendChild(bgGroup);

      // 星座连线：主星之间
      const lineGroup = document.createElementNS(SVG_NS, 'g');
      mainPositions.forEach((pos, i) => {
        if (i === mainPositions.length - 1) return;
        const next = mainPositions[i + 1];
        const line = document.createElementNS(SVG_NS, 'line');
        line.setAttribute('x1', pos.x); line.setAttribute('y1', pos.y);
        line.setAttribute('x2', next.x); line.setAttribute('y2', next.y);
        line.setAttribute('class', 'constellation-line');
        line.setAttribute('stroke', 'rgba(139, 92, 246, 0.25)');
        lineGroup.appendChild(line);
      });
      svg.appendChild(lineGroup);

      // 主星与子星
      cats.forEach((cat, i) => {
        const main = mainPositions[i];
        const subs = cat.subcategories || [];
        const subPos = subPositions[i];
        const catDocCount = allDocs.filter(d => d.category_slug === cat.slug).length;

        // 连线：主星到子星
        const g = document.createElementNS(SVG_NS, 'g');
        subPos.forEach(sp => {
          const line = document.createElementNS(SVG_NS, 'line');
          line.setAttribute('x1', main.x); line.setAttribute('y1', main.y);
          line.setAttribute('x2', sp.x); line.setAttribute('y2', sp.y);
          line.setAttribute('class', 'constellation-line');
          line.setAttribute('stroke', 'rgba(251, 191, 36, 0.22)');
          g.appendChild(line);
        });

        // 子星
        subs.forEach((sub, j) => {
          const sp = subPos[j];
          const subDocCount = allDocs.filter(d => d.subcategory_slug === sub.slug).length;
          const node = document.createElementNS(SVG_NS, 'g');
          node.setAttribute('class', 'star-node sub-node');
          node.style.cursor = 'pointer';

          const core = document.createElementNS(SVG_NS, 'circle');
          core.setAttribute('cx', sp.x); core.setAttribute('cy', sp.y);
          core.setAttribute('r', 4.5);
          core.setAttribute('class', 'star-core sub-star');
          node.appendChild(core);

          const label = document.createElementNS(SVG_NS, 'text');
          label.setAttribute('x', sp.x);
          label.setAttribute('y', sp.y + (sp.y < main.y ? -12 : 20));
          label.textContent = sub.name;
          node.appendChild(label);

          // 交互
          node.addEventListener('mouseenter', (e) => {
            showTooltip(e, sub.name, `${cat.name} · ${subDocCount} 篇文档 · 点击跃迁`);
          });
          node.addEventListener('mousemove', (e) => moveTooltip(e));
          node.addEventListener('mouseleave', hideTooltip);
          node.addEventListener('click', () => {
            jumpToFilter(cat.slug, sub.slug);
          });

          g.appendChild(node);
        });

        // 主星
        const mainNode = document.createElementNS(SVG_NS, 'g');
        mainNode.setAttribute('class', 'star-node main-node');
        mainNode.style.cursor = 'pointer';

        const halo = document.createElementNS(SVG_NS, 'circle');
        halo.setAttribute('cx', main.x); halo.setAttribute('cy', main.y);
        halo.setAttribute('r', 16);
        halo.setAttribute('class', 'star-halo');
        halo.style.animationDelay = (i * 0.4) + 's';
        halo.style.transformOrigin = `${main.x}px ${main.y}px`;
        mainNode.appendChild(halo);

        const core = document.createElementNS(SVG_NS, 'circle');
        core.setAttribute('cx', main.x); core.setAttribute('cy', main.y);
        core.setAttribute('r', 9);
        core.setAttribute('class', 'star-core main-star');
        mainNode.appendChild(core);

        const label = document.createElementNS(SVG_NS, 'text');
        label.setAttribute('x', main.x);
        label.setAttribute('y', main.y + 32);
        label.textContent = cat.name;
        mainNode.appendChild(label);

        mainNode.addEventListener('mouseenter', (e) => {
          showTooltip(e, cat.name, `${catDocCount} 篇文档${subs.length ? ` · ${subs.length} 个子领域` : ''} · 点击跃迁`);
        });
        mainNode.addEventListener('mousemove', (e) => moveTooltip(e));
        mainNode.addEventListener('mouseleave', hideTooltip);
        mainNode.addEventListener('click', () => {
          jumpToFilter(cat.slug, '');
        });

        g.appendChild(mainNode);
        svg.appendChild(g);
      });

      function showTooltip(e, title, meta) {
        tooltip.innerHTML = `<div class="tt-title"><i class="fas fa-star"></i> ${escapeHtml(title)}</div><div class="tt-meta">${escapeHtml(meta)}</div>`;
        tooltip.classList.add('show');
        moveTooltip(e);
      }
      function moveTooltip(e) {
        const rect = document.getElementById('starMapContainer').getBoundingClientRect();
        let x = e.clientX - rect.left + 14;
        let y = e.clientY - rect.top - 10;
        if (x + 180 > rect.width) x = e.clientX - rect.left - 190;
        tooltip.style.left = x + 'px';
        tooltip.style.top = y + 'px';
      }
      function hideTooltip() { tooltip.classList.remove('show'); }
    }

    /* 跃迁到指定筛选（URL 驱动） */
    function jumpToFilter(categorySlug, subSlug) {
      const params = new URLSearchParams();
      params.set('category', categorySlug);
      if (subSlug) params.set('subcategory', subSlug);
      const newUrl = `portal.html?${params.toString()}`;
      history.pushState(null, '', newUrl);

      activeCategory = categorySlug;
      activeSubcategory = subSlug || '';
      renderCategories();
      renderSubcategories();
      renderDocs();
      document.getElementById('docGrid').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    /* ================= 分类筛选 ================= */

    function renderCategories() {
      const tabs = document.getElementById('categoryTabs');
      let html = `<div class="cat-tab ${activeCategory === 'all' ? 'active' : ''}" onclick="selectCategory('all')">
        <i class="fas fa-globe"></i> 全部
      </div>`;
      allCategories.forEach(cat => {
        html += `<div class="cat-tab ${activeCategory === cat.slug ? 'active' : ''}" onclick="selectCategory('${cat.slug}')">
          <i class="${cat.icon}"></i> ${cat.name}
          ${cat.subcategories && cat.subcategories.length ? `<span style="font-size:.65rem;opacity:.6;">▾</span>` : ''}
        </div>`;
      });
      tabs.innerHTML = html;
    }

    function selectCategory(slug) {
      activeCategory = slug;
      activeSubcategory = '';
      updateUrl();
      renderCategories();
      renderSubcategories();
      renderDocs();
    }

    function selectSubcategory(slug) {
      activeSubcategory = activeSubcategory === slug ? '' : slug;
      updateUrl();
      renderSubcategories();
      renderDocs();
    }

    function updateUrl() {
      const params = new URLSearchParams();
      if (activeCategory !== 'all') {
        params.set('category', activeCategory);
        if (activeSubcategory) params.set('subcategory', activeSubcategory);
      }
      const qs = params.toString();
      history.replaceState(null, '', qs ? `portal.html?${qs}` : 'portal.html');
    }

    function renderSubcategories() {
      const bar = document.getElementById('subCategoryBar');
      const cat = allCategories.find(c => c.slug === activeCategory);

      if (!cat || !cat.subcategories || cat.subcategories.length === 0) {
        bar.innerHTML = '';
        return;
      }

      let html = `<span class="sub-label"><i class="fas fa-sitemap"></i> 子领域：</span>`;
      cat.subcategories.forEach(sub => {
        const cnt = allDocs.filter(d => d.subcategory_slug === sub.slug).length;
        html += `<span class="sub-chip ${activeSubcategory === sub.slug ? 'active' : ''}"
          onclick="selectSubcategory('${sub.slug}')">
          ${escapeHtml(sub.name)} <span class="cnt">${cnt}</span>
        </span>`;
      });
      bar.innerHTML = html;
    }

    /* ================= 文档列表 ================= */

    function handleSearch() {
      searchKeyword = document.getElementById('searchInput').value.trim().toLowerCase();
      renderDocs();
    }

    function renderDocs() {
      const grid = document.getElementById('docGrid');
      let docs = allDocs;

      if (activeCategory !== 'all') {
        docs = docs.filter(d => d.category_slug === activeCategory);
      }
      if (activeSubcategory) {
        docs = docs.filter(d => d.subcategory_slug === activeSubcategory);
      }
      if (searchKeyword) {
        docs = docs.filter(d =>
          d.title.toLowerCase().includes(searchKeyword) ||
          d.description.toLowerCase().includes(searchKeyword) ||
          (d.tags || '').toLowerCase().includes(searchKeyword)
        );
      }

      if (docs.length === 0) {
        grid.innerHTML = `
          <div class="empty-state" style="grid-column:1/-1;">
            <div class="icon"><i class="fas fa-meteor"></i></div>
            <p>未找到匹配的资源，换个关键词试试？</p>
          </div>`;
        return;
      }

      grid.innerHTML = docs.map(doc => {
        const tags = (doc.tags || '').split(',').filter(Boolean).slice(0, 4)
          .map(t => `<span class="doc-tag">${escapeHtml(t.trim())}</span>`).join('');
        return `
          <div class="doc-card" onclick="location.href='document.html?id=${doc.id}'">
            <div class="doc-cat-badge">
              <i class="${doc.category_icon || 'fas fa-folder'}"></i>
              ${escapeHtml(doc.category_name || '未分类')}
              ${doc.subcategory_name ? `<span class="doc-sub-badge">· ${escapeHtml(doc.subcategory_name)}</span>` : ''}
            </div>
            <h3>${escapeHtml(doc.title)}</h3>
            <p class="doc-desc">${escapeHtml(doc.description)}</p>
            ${tags ? `<div class="doc-tags">${tags}</div>` : ''}
            <div class="doc-meta">
              <span class="views"><i class="far fa-eye"></i> ${doc.views || 0}</span>
              <span>${formatDate(doc.created_at)}</span>
              ${doc.url ? `<span class="ext-link"><i class="fas fa-arrow-up-right-from-square"></i> 外链</span>` : ''}
            </div>
          </div>`;
      }).join('');
    }

    function logout() {
      API.setToken(null);
      redirect('./');
    }

    init();
  </script>
</body>
</html>
